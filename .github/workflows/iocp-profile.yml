name: IOCP Diagnostic Profiles

on:
  push:
    branches: ['fix/iocp-prof-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Profile HTTP and TLS backend paths
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-binutils
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
    - name: Build instrumented nginx and native diagnostic helper
      shell: msys2 {0}
      run: |
        set -euo pipefail
        ./auto/configure --with-cc=gcc \
          --with-cc-opt="-O2 -g -pg -DNGX_WIN32_GPROF=1 -DFD_SETSIZE=1024" \
          --with-ld-opt="-pg" --prefix= --sbin-path=nginx.exe \
          --conf-path=conf/nginx.conf --pid-path=logs/nginx.pid \
          --error-log-path=logs/error.log --http-log-path=logs/access.log \
          --with-pcre --with-http_ssl_module --with-http_v2_module
        make -j$(nproc)
        mkdir -p benchmark-bin
        cp objs/nginx.exe /mingw64/bin/openssl.exe benchmark-bin/
        gcc -O2 -Wall -Wextra -Werror misc/win32-benchmark-helper.c \
          -o benchmark-bin/benchmark-helper.exe -lws2_32
        for program in objs/nginx.exe /mingw64/bin/openssl.exe; do
          ldd "$program" | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            if [ -f "$dll" ]; then cp "$dll" benchmark-bin/; fi
          done
        done
        gcc --version > benchmark-bin/compiler.txt
        pacman -Q > benchmark-bin/packages.txt
    - name: Install pinned client
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/hatoo/oha/releases/download/v1.16.0/oha-windows-amd64.exe `
          -OutFile benchmark-bin/oha.exe
        node --check .\misc\win32-iocp-profile.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Collect profiles without making throughput claims
      shell: pwsh
      run: |
        node .\misc\win32-iocp-profile.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Decode worker and router profiles
      if: always()
      shell: msys2 {0}
      run: |
        set -euo pipefail
        shopt -s nullglob
        for profile in profile-results/*/gprof/*/gmon.out; do
          gprof benchmark-bin/nginx.exe "$profile" > "$profile.txt"
        done
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iocp-diagnostic-profiles
        path: |
          profile-results/
          benchmark-bin/nginx.exe
          benchmark-bin/compiler.txt
          benchmark-bin/packages.txt
        retention-days: 90
