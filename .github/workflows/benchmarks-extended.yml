name: Performance Benchmarks (Extended)

on:
  push:
    branches: ['fix/benchmark-*']
    paths:
      - '.github/workflows/benchmarks-extended.yml'
      - 'misc/benchmark-report.js'
      - 'misc/test-benchmark-report.js'
      - 'misc/win32-ci-benchmark.js'
      - 'misc/win32-benchmark-helper.c'
      - 'misc/validate-oha-summary.js'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'All cases: quick 2s x 6, standard 3s x 6, comprehensive 3s x 12'
        required: true
        type: choice
        options: ['quick', 'standard', 'comprehensive']
        default: 'quick'
      worker_count:
        description: 'Multi-worker count (always compared with one worker)'
        required: true
        type: choice
        options: ['2', '4', '8']
        default: '4'
  schedule:
    - cron: '0 3 1 * *'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate benchmark tools
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl

    - name: Test coverage, validation, pairing, and filtering
      shell: pwsh
      run: |
        node .\misc\test-benchmark-report.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node --check .\misc\win32-ci-benchmark.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build optimized nginx and native helper
      shell: msys2 {0}
      run: |
        set -eu
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O2 -march=x86-64 -mtune=generic -DFD_SETSIZE=1024" \
          --prefix= \
          --sbin-path=nginx.exe \
          --conf-path=conf/nginx.conf \
          --pid-path=logs/nginx.pid \
          --error-log-path=logs/error.log \
          --http-log-path=logs/access.log \
          --with-pcre \
          --with-http_ssl_module \
          --with-http_v2_module
        make -j$(nproc)
        mkdir -p benchmark-bin
        gcc -O2 -Wall -Wextra -Werror misc/win32-benchmark-helper.c \
          -o benchmark-bin/benchmark-helper.exe -lws2_32
        cp objs/nginx.exe /mingw64/bin/openssl.exe benchmark-bin/
        for program in objs/nginx.exe /mingw64/bin/openssl.exe; do
          ldd "$program" | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
            if [ -f "$dll" ]; then cp "$dll" benchmark-bin/; fi
          done
        done

    - name: Install native HTTP load generator
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://github.com/hatoo/oha/releases/download/v1.16.0/oha-windows-amd64.exe `
          -OutFile benchmark-bin/oha.exe
        .\benchmark-bin\oha.exe --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Exercise every case with short smoke samples
      shell: pwsh
      run: |
        foreach ($kind in @('static', 'proxy')) {
          node .\misc\win32-ci-benchmark.js --smoke --kind $kind `
            --binary .\benchmark-bin\nginx.exe --oha .\benchmark-bin\oha.exe `
            --helper .\benchmark-bin\benchmark-helper.exe --openssl .\benchmark-bin\openssl.exe `
            --output "smoke-results/$kind"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - uses: actions/upload-artifact@v4
      with:
        name: benchmark-binaries
        path: benchmark-bin/
        retention-days: 7

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-smoke-results
        path: smoke-results/
        retention-days: 14

  benchmark:
    name: Repeated ${{ matrix.kind }} comparisons
    needs: build
    runs-on: windows-2022
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        kind: [static, proxy]
    env:
      BENCH_SUITE: ${{ github.event.inputs.test_suite || 'quick' }}
      BENCH_WORKERS: ${{ github.event.inputs.worker_count || '4' }}
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - uses: actions/download-artifact@v4
      with:
        name: benchmark-binaries
        path: benchmark-bin

    - name: Run every comparison with short repeated samples
      shell: pwsh
      run: |
        node .\misc\win32-ci-benchmark.js --kind '${{ matrix.kind }}' `
          --suite "$env:BENCH_SUITE" --multi-workers "$env:BENCH_WORKERS" `
          --binary .\benchmark-bin\nginx.exe --oha .\benchmark-bin\oha.exe `
          --helper .\benchmark-bin\benchmark-helper.exe --openssl .\benchmark-bin\openssl.exe `
          --output 'benchmark-results/${{ matrix.kind }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Publish measurement summary
      if: always()
      shell: pwsh
      run: |
        $summary = 'benchmark-results/${{ matrix.kind }}/summary.md'
        if (Test-Path $summary) {
          Get-Content -Raw $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        }

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-${{ matrix.kind }}
        path: benchmark-results/${{ matrix.kind }}/
        retention-days: 90
