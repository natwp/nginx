name: Performance Benchmarks (Extended)

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Benchmark suite to run'
        required: true
        type: choice
        options:
          - 'quick'
          - 'standard'
          - 'comprehensive'
        default: 'standard'
      worker_count:
        description: 'Number of worker processes'
        required: false
        default: '4'
  schedule:
    # Run monthly on the 1st at 3 AM UTC
    - cron: '0 3 1 * *'

jobs:
  benchmark-http:
    name: HTTP Benchmark Suite
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-pkg-config

    - name: Build optimized nginx
      shell: msys2 {0}
      run: |
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O3 -march=x86-64 -mtune=generic" \
          --with-pcre \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-http_stub_status_module \
          --with-stream \
          --with-stream_ssl_module

        make -j$(nproc)
        ls -lh objs/nginx.exe

    - name: Install oha (HTTP benchmarking tool)
      shell: pwsh
      run: |
        Write-Host "=== Installing oha benchmarking tool ===" -ForegroundColor Cyan
        $ohaVersion = "v1.4.5"
        $ohaUrl = "https://github.com/hatoo/oha/releases/download/$ohaVersion/oha-windows-amd64.zip"

        Invoke-WebRequest -Uri $ohaUrl -OutFile oha.zip
        Expand-Archive -Path oha.zip -DestinationPath . -Force

        if (Test-Path ".\oha.exe") {
          Write-Host "✓ oha installed successfully"
          .\oha.exe --version
        } else {
          Write-Host "✗ oha installation failed"
          exit 1
        }

    - name: Setup benchmark environment
      shell: pwsh
      run: |
        Write-Host "=== Setting up benchmark environment ===" -ForegroundColor Cyan

        # Create test directory and files
        New-Item -ItemType Directory -Path "html" -Force | Out-Null

        # Create benchmark files
        $sizes = @{
          "1k.bin" = 1024
          "4k.bin" = 4096
          "16k.bin" = 16384
          "64k.bin" = 65536
          "256k.bin" = 262144
          "1m.bin" = 1048576
        }

        foreach ($file in $sizes.Keys) {
          $bytes = [byte[]]::new($sizes[$file])
          [System.IO.File]::WriteAllBytes("html\$file", $bytes)
        }

        Write-Host "✓ Created benchmark files"

        # Create logs directory
        New-Item -ItemType Directory -Path "logs" -Force | Out-Null

        $workers = "${{ github.event.inputs.worker_count || '4' }}"

        # Create benchmark configuration using array join
        $config = @(
          "worker_processes  $workers;",
          'error_log  logs/error.log  warn;',
          'pid        logs/nginx.pid;',
          '',
          'events {',
          '    worker_connections  2048;',
          '}',
          '',
          'http {',
          '    default_type  application/octet-stream;',
          '    sendfile      on;',
          '    tcp_nopush    on;',
          '    keepalive_timeout  65;',
          '',
          '    server {',
          '        listen       8080;',
          '        server_name  localhost;',
          '',
          '        location / {',
          '            root   html;',
          '        }',
          '',
          '        location /status {',
          '            stub_status;',
          '        }',
          '    }',
          '}'
        ) -join "`n"
        
        $config | Out-File -Encoding UTF8 "benchmark.conf"
        Write-Host "✓ Created benchmark.conf with $workers workers"

    - name: Run IOCP benchmark
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== IOCP Event Method Benchmark ===" -ForegroundColor Cyan

        $suite = "${{ github.event.inputs.test_suite || 'standard' }}"
        $files = @()
        
        switch ($suite) {
          'quick' { $files = @('1k.bin', '64k.bin') }
          'standard' { $files = @('1k.bin', '16k.bin', '64k.bin', '256k.bin') }
          'comprehensive' { $files = @('1k.bin', '4k.bin', '16k.bin', '64k.bin', '256k.bin', '1m.bin') }
        }

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-c","benchmark.conf" -NoNewWindow
        Start-Sleep -Seconds 3

        $results = @()

        foreach ($file in $files) {
          Write-Host ""
          Write-Host "Benchmarking $file..." -ForegroundColor Yellow
          
          $output = .\oha.exe -z 10s -c 100 --no-tui http://127.0.0.1:8080/$file 2>&1 | Out-String
          
          # Extract key metrics
          if ($output -match 'Requests/sec:\s+([\d.]+)') {
            $reqSec = $Matches[1]
            Write-Host "  Requests/sec: $reqSec"
            $results += "$file : $reqSec req/s"
          }
        }

        # Stop nginx
        .\objs\nginx.exe -s quit
        Start-Sleep -Seconds 2

        Write-Host ""
        Write-Host "=== Benchmark Results ===" -ForegroundColor Green
        $results | ForEach-Object { Write-Host "  $_" }

    - name: Benchmark comparison (select vs IOCP)
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Event Method Comparison ===" -ForegroundColor Cyan

        $methods = @('select', 'poll')
        $testFile = '64k.bin'

        foreach ($method in $methods) {
          Write-Host ""
          Write-Host "Testing $method..." -ForegroundColor Yellow

          # Update config for this method
          $workers = "${{ github.event.inputs.worker_count || '4' }}"
          $config = @(
            "worker_processes  $workers;",
            'error_log  logs/error.log  warn;',
            'pid        logs/nginx.pid;',
            '',
            'events {',
            "    use $method;",
            '    worker_connections  2048;',
            '}',
            '',
            'http {',
            '    default_type  application/octet-stream;',
            '    sendfile      on;',
            '    tcp_nopush    on;',
            '    keepalive_timeout  65;',
            '',
            '    server {',
            '        listen       8080;',
            '        server_name  localhost;',
            '        location / {',
            '            root   html;',
            '        }',
            '    }',
            '}'
          ) -join "`n"
          
          $config | Out-File -Encoding UTF8 "benchmark.conf"

          # Start nginx
          Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-c","benchmark.conf" -NoNewWindow
          Start-Sleep -Seconds 3

          $output = .\oha.exe -z 10s -c 100 --no-tui http://127.0.0.1:8080/$testFile 2>&1 | Out-String
          
          if ($output -match 'Requests/sec:\s+([\d.]+)') {
            $reqSec = $Matches[1]
            Write-Host "  $method: $reqSec req/s" -ForegroundColor Green
          }

          # Stop nginx
          .\objs\nginx.exe -s quit
          Start-Sleep -Seconds 2
        }

    - name: Cleanup
      if: always()
      shell: pwsh
      run: |
        Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          logs/*.log
          benchmark.conf
        retention-days: 30
