name: Load and Stress Tests

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Test duration per scenario (e.g., 30s, 1m, 5m)'
        required: false
        default: '30s'
      connections:
        description: 'Number of concurrent connections'
        required: false
        default: '100'
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  load-tests:
    name: HTTP Load Tests
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-pkg-config

    - name: Build optimized nginx
      shell: msys2 {0}
      run: |
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O3 -march=x86-64" \
          --with-pcre \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_gzip_static_module \
          --with-http_stub_status_module \
          --with-stream \
          --with-stream_ssl_module

        make -j$(nproc)
        ls -lh objs/nginx.exe

    - name: Install oha (HTTP load testing tool)
      shell: pwsh
      run: |
        # oha publishes a bare .exe per platform, not an archive.
        $ohaVersion = "v1.16.0"
        $ohaUrl = "https://github.com/hatoo/oha/releases/download/$ohaVersion/oha-windows-amd64.exe"

        Write-Host "Downloading oha $ohaVersion"
        Invoke-WebRequest -Uri $ohaUrl -OutFile oha.exe

        .\oha.exe --version
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

    - name: Setup test environment
      shell: pwsh
      run: |
        Write-Host "=== Setting up test environment ===" -ForegroundColor Cyan

        # Create test directory and files
        New-Item -ItemType Directory -Path "html" -Force | Out-Null

        # Create test files of various sizes
        $bytes1k = [byte[]]::new(1024)
        $bytes64k = [byte[]]::new(65536)
        $bytes1m = [byte[]]::new(1048576)

        [System.IO.File]::WriteAllBytes("html\1k.txt", $bytes1k)
        [System.IO.File]::WriteAllBytes("html\64k.txt", $bytes64k)
        [System.IO.File]::WriteAllBytes("html\1m.txt", $bytes1m)

        Write-Host "✓ Created test files: 1k.txt, 64k.txt, 1m.txt"

        # Create logs directory
        New-Item -ItemType Directory -Path "logs" -Force | Out-Null

        # Create load test configuration (using -join to avoid YAML issues)
        $config = @(
          'worker_processes  4;',
          'error_log  logs/error.log  notice;',
          'pid        logs/nginx.pid;',
          '',
          'events {',
          '    worker_connections  1024;',
          '}',
          '',
          'http {',
          '    default_type  application/octet-stream;',
          '    sendfile      on;',
          '    keepalive_timeout  65;',
          '',
          '    server {',
          '        listen       18090;',
          '        server_name  localhost;',
          '',
          '        location / {',
          '            root   html;',
          '        }',
          '    }',
          '}'
        ) -join "`n"
        
        $config | Out-File -Encoding UTF8 "load-test.conf"
        Write-Host "✓ Created load-test.conf"

    - name: Run small file load test
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Small File (1KB) Load Test ===" -ForegroundColor Cyan

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-p","./","-c","load-test.conf" -NoNewWindow
        $ready = $false
        foreach ($attempt in 1..30) {
          Start-Sleep -Milliseconds 500
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:18090/1k.txt `
              -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          } catch { }
        }
        if (-not $ready) {
          Write-Host "nginx did not become ready on port 18090"
          if (Test-Path logs/error.log) { Get-Content logs/error.log }
          exit 1
        }

        # Run load test
        $duration = "${{ github.event.inputs.duration || '30s' }}"
        $connections = "${{ github.event.inputs.connections || '100' }}"

        .\oha.exe -z $duration -c $connections --no-tui http://127.0.0.1:18090/1k.txt
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

        # Stop nginx
        .\objs\nginx.exe -p ./ -s quit -c load-test.conf
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 1
        }

    - name: Run medium file load test
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Medium File (64KB) Load Test ===" -ForegroundColor Cyan

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-p","./","-c","load-test.conf" -NoNewWindow
        $ready = $false
        foreach ($attempt in 1..30) {
          Start-Sleep -Milliseconds 500
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:18090/1k.txt `
              -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          } catch { }
        }
        if (-not $ready) {
          Write-Host "nginx did not become ready on port 18090"
          if (Test-Path logs/error.log) { Get-Content logs/error.log }
          exit 1
        }

        # Run load test
        $duration = "${{ github.event.inputs.duration || '30s' }}"
        $connections = "${{ github.event.inputs.connections || '100' }}"

        .\oha.exe -z $duration -c $connections --no-tui http://127.0.0.1:18090/64k.txt
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

        # Stop nginx
        .\objs\nginx.exe -p ./ -s quit -c load-test.conf
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 1
        }

    - name: Run large file load test
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Large File (1MB) Load Test ===" -ForegroundColor Cyan

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-p","./","-c","load-test.conf" -NoNewWindow
        $ready = $false
        foreach ($attempt in 1..30) {
          Start-Sleep -Milliseconds 500
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:18090/1k.txt `
              -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          } catch { }
        }
        if (-not $ready) {
          Write-Host "nginx did not become ready on port 18090"
          if (Test-Path logs/error.log) { Get-Content logs/error.log }
          exit 1
        }

        # Run load test with fewer connections for large files
        $duration = "${{ github.event.inputs.duration || '30s' }}"
        $connections = [math]::Max(50, [int]"${{ github.event.inputs.connections || '100' }}" / 2)

        Write-Host "Using $connections connections for large file test"
        .\oha.exe -z $duration -c $connections --no-tui http://127.0.0.1:18090/1m.txt
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

        # Stop nginx
        .\objs\nginx.exe -p ./ -s quit -c load-test.conf
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 1
        }

    - name: Run keepalive stress test
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Keepalive Stress Test ===" -ForegroundColor Cyan

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-p","./","-c","load-test.conf" -NoNewWindow
        $ready = $false
        foreach ($attempt in 1..30) {
          Start-Sleep -Milliseconds 500
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:18090/1k.txt `
              -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          } catch { }
        }
        if (-not $ready) {
          Write-Host "nginx did not become ready on port 18090"
          if (Test-Path logs/error.log) { Get-Content logs/error.log }
          exit 1
        }

        # Run with HTTP/1.1 keepalive
        $duration = "${{ github.event.inputs.duration || '30s' }}"
        $connections = "${{ github.event.inputs.connections || '100' }}"

        Write-Host "Testing with keepalive connections"
        .\oha.exe -z $duration -c $connections --no-tui --http-version 1.1 http://127.0.0.1:18090/1k.txt
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

        # Stop nginx
        .\objs\nginx.exe -p ./ -s quit -c load-test.conf
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 1
        }

    - name: Run connection churn test
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        Write-Host ""
        Write-Host "=== Connection Churn Test ===" -ForegroundColor Cyan

        # Start nginx
        Start-Process -FilePath ".\objs\nginx.exe" -ArgumentList "-p","./","-c","load-test.conf" -NoNewWindow
        $ready = $false
        foreach ($attempt in 1..30) {
          Start-Sleep -Milliseconds 500
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:18090/1k.txt `
              -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          } catch { }
        }
        if (-not $ready) {
          Write-Host "nginx did not become ready on port 18090"
          if (Test-Path logs/error.log) { Get-Content logs/error.log }
          exit 1
        }

        # Run with HTTP/1.0 (no keepalive)
        $duration = "${{ github.event.inputs.duration || '30s' }}"
        $connections = "${{ github.event.inputs.connections || '100' }}"

        Write-Host "Testing connection churn (no keepalive)"
        .\oha.exe -z $duration -c $connections --no-tui --http-version 1.0 --disable-keepalive http://127.0.0.1:18090/1k.txt
        if ($LASTEXITCODE -ne 0) {
          Write-Host "oha exited with code $LASTEXITCODE"
          exit 1
        }

        # Stop nginx
        .\objs\nginx.exe -p ./ -s quit -c load-test.conf
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Milliseconds 500
        }
        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          exit 1
        }

        Write-Host ""
        Write-Host "✓ All load tests completed" -ForegroundColor Green

    - name: Collect performance logs
      if: always()
      shell: pwsh
      run: |
        if (Test-Path logs/error.log) {
          Write-Host ""
          Write-Host "=== Error Log (last 50 lines) ===" -ForegroundColor Yellow
          Get-Content logs/error.log -Tail 50
        }

    - name: Cleanup
      if: always()
      shell: pwsh
      run: |
        Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: |
          logs/*.log
          load-test.conf
        retention-days: 14
