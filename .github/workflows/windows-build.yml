name: Windows Build and Test

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  PCRE2_VERSION: '10.44'
  ZLIB_VERSION: '1.3.1'
  OPENSSL_VERSION: '3.3.2'

jobs:
  build:
    name: Build nginx-iocp
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x64]
        config: [Release, Debug]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-pkg-config

    - name: Build nginx with MinGW
      shell: msys2 {0}
      run: |
        cd $GITHUB_WORKSPACE
        
        # Configure build
        if [ "${{ matrix.config }}" = "Debug" ]; then
          DEBUG_FLAG="--with-debug"
        else
          DEBUG_FLAG=""
        fi
        
        ./auto/configure \
          --with-cc=gcc \
          --with-cpu-opt=generic \
          --builddir=objs \
          --with-pcre \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_realip_module \
          --with-http_addition_module \
          --with-http_sub_module \
          --with-http_dav_module \
          --with-http_flv_module \
          --with-http_mp4_module \
          --with-http_gunzip_module \
          --with-http_gzip_static_module \
          --with-http_auth_request_module \
          --with-http_random_index_module \
          --with-http_secure_link_module \
          --with-http_degradation_module \
          --with-http_slice_module \
          --with-http_stub_status_module \
          --with-stream \
          --with-stream_ssl_module \
          --with-stream_realip_module \
          --with-stream_ssl_preread_module \
          $DEBUG_FLAG
        
        # Build
        make -j$(nproc)
        
        # Verify binary exists
        ls -lh objs/nginx.exe

    - name: Run configuration test
      shell: msys2 {0}
      run: |
        cd $GITHUB_WORKSPACE
        ./objs/nginx.exe -V
        ./objs/nginx.exe -t -p . -c conf/nginx.conf

    - name: Run release candidate tests
      shell: pwsh
      run: |
        Set-ExecutionPolicy -Scope Process Bypass
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
        
        # Find OpenSSL
        $openssl = Get-Command openssl -ErrorAction SilentlyContinue
        if ($openssl) {
          .\misc\win32-rc-test.ps1 -Binary .\objs\nginx.exe -OpenSSLBinary $openssl.Source
        } else {
          .\misc\win32-rc-test.ps1 -Binary .\objs\nginx.exe
        }

    - name: Upload build artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: nginx-iocp-${{ matrix.config }}-${{ matrix.arch }}
        path: |
          objs/nginx.exe
          objs/autoconf.err
          objs/ngx_auto_config.h
        retention-days: 7

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ matrix.config }}-${{ matrix.arch }}
        path: |
          objs/*.log
          objs/logs/*.log
        retention-days: 7
