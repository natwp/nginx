name: Smoke Tests

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  smoke-tests:
    name: Quick Validation Tests
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl

    - name: Build nginx
      shell: msys2 {0}
      run: |
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O2" \
          --with-pcre \
          --with-http_ssl_module

        make -j$(nproc)
        
        if [ -f objs/nginx.exe ]; then
          echo "✓ Build successful"
          ls -lh objs/nginx.exe
        else
          echo "✗ Build failed - nginx.exe not found"
          exit 1
        fi

    - name: Test version output
      shell: msys2 {0}
      run: |
        echo "=== Test version output ==="
        ./objs/nginx.exe -v
        ./objs/nginx.exe -V
        echo "✓ Version check passed"

    - name: Test help output
      shell: msys2 {0}
      run: |
        echo "=== Test help output ==="
        ./objs/nginx.exe -h || true
        ./objs/nginx.exe -? || true
        echo "✓ Help output check passed"

    - name: Test configuration parsing
      shell: msys2 {0}
      run: |
        echo "=== Test configuration parsing ==="
        mkdir -p logs temp

        printf '%s\n' \
          'worker_processes  1;' \
          'events {' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       8080;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "OK";' \
          '        }' \
          '    }' \
          '}' > test-config.conf

        if ./objs/nginx.exe -t -c test-config.conf; then
          echo "✓ Configuration test passed"
        else
          echo "✗ Configuration test failed"
          exit 1
        fi

    - name: Test basic startup and shutdown
      shell: msys2 {0}
      run: |
        echo "=== Test basic startup and shutdown ==="
        mkdir -p logs html temp

        echo "Hello from nginx" > html/index.html

        printf '%s\n' \
          'worker_processes  1;' \
          'daemon off;' \
          'master_process off;' \
          'error_log  logs/error.log  notice;' \
          'events {' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  text/html;' \
          '    server {' \
          '        listen       8080;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            root   html;' \
          '        }' \
          '    }' \
          '}' > startup-test.conf

        timeout 5 ./objs/nginx.exe -c startup-test.conf &
        NGINX_PID=$!
        sleep 2

        if kill -0 $NGINX_PID 2>/dev/null; then
          echo "✓ Nginx started successfully"
          kill $NGINX_PID
          wait $NGINX_PID 2>/dev/null || true
          echo "✓ Nginx stopped successfully"
        else
          echo "✗ Nginx failed to start"
          cat logs/error.log
          exit 1
        fi

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs
        path: logs/
        retention-days: 7
