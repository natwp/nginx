name: Smoke Tests

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  smoke-tests:
    name: Quick Validation Tests
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl

    - name: Build nginx
      shell: msys2 {0}
      run: |
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O2" \
          --with-pcre \
          --with-http_ssl_module

        make -j$(nproc)
        
        if [ -f objs/nginx.exe ]; then
          echo "✓ Build successful"
          ls -lh objs/nginx.exe
        else
          echo "✗ Build failed - nginx.exe not found"
          exit 1
        fi

    - name: Test version output
      shell: msys2 {0}
      run: |
        echo "=== Test version output ==="
        ./objs/nginx.exe -v
        ./objs/nginx.exe -V
        echo "✓ Version check passed"

    - name: Test help output
      shell: msys2 {0}
      run: |
        echo "=== Test help output ==="
        ./objs/nginx.exe -h || true
        ./objs/nginx.exe -? || true
        echo "✓ Help output check passed"

    - name: Test configuration parsing
      shell: msys2 {0}
      run: |
        echo "=== Test configuration parsing ==="
        mkdir -p logs temp

        printf '%s\n' \
          'worker_processes  1;' \
          'events {' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       18080;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "OK";' \
          '        }' \
          '    }' \
          '}' > test-config.conf

        # Use -p prefix to set working directory
        if ./objs/nginx.exe -t -p ./ -c test-config.conf; then
          echo "✓ Configuration test passed"
        else
          echo "✗ Configuration test failed"
          exit 1
        fi

    - name: Write startup test config
      shell: msys2 {0}
      run: |
        mkdir -p logs html temp
        echo "Hello from nginx" > html/index.html

        printf '%s\n' \
          'worker_processes  1;' \
          'error_log  logs/error.log  notice;' \
          'pid        logs/nginx.pid;' \
          'events {' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  text/html;' \
          '    server {' \
          '        listen       18080;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            root   html;' \
          '        }' \
          '    }' \
          '}' > startup-test.conf

        ./objs/nginx.exe -t -p ./ -c startup-test.conf

    - name: Test basic startup and shutdown
      shell: pwsh
      run: |
        # nginx on Windows runs in the foreground, so it must be launched
        # detached; otherwise the step blocks until the job timeout.
        Write-Host "=== Test basic startup and shutdown ==="

        Start-Process -FilePath ".\objs\nginx.exe" `
          -ArgumentList "-p","./","-c","startup-test.conf" -NoNewWindow
        Start-Sleep -Seconds 3

        $processes = @(Get-Process nginx -ErrorAction SilentlyContinue)
        if ($processes.Count -lt 2) {
          Write-Host "nginx failed to start (found $($processes.Count) processes)"
          if (Test-Path logs/error.log) {
            Write-Host "=== Error log ==="
            Get-Content logs/error.log
          }
          exit 1
        }
        Write-Host "OK: master + worker started ($($processes.Count) processes)"

        $body = (Invoke-WebRequest -Uri http://127.0.0.1:18080/ -UseBasicParsing).Content
        if ($body -match 'Hello') {
          Write-Host "OK: nginx served the test page"
        } else {
          Write-Host "nginx responded with unexpected body: $body"
          exit 1
        }

        .\objs\nginx.exe -p ./ -s quit -c startup-test.conf

        $deadline = (Get-Date).AddSeconds(15)
        while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
               ((Get-Date) -lt $deadline)) {
          Start-Sleep -Seconds 1
        }

        if (Get-Process nginx -ErrorAction SilentlyContinue) {
          Write-Host "nginx did not exit after quit"
          exit 1
        }
        Write-Host "OK: nginx stopped gracefully"

    - name: Cleanup
      if: always()
      shell: pwsh
      run: |
        Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs
        path: logs/
        retention-days: 7
