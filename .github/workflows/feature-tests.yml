name: Feature Tests

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  feature-tests:
    name: Feature Configuration Tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl

    - name: Build with minimal modules
      shell: msys2 {0}
      run: |
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O2" \
          --with-pcre

        make -j$(nproc)
        ls -lh objs/nginx.exe

    - name: Test IOCP event method
      shell: msys2 {0}
      run: |
        echo "=== Test IOCP event method ==="
        mkdir -p logs temp

        printf '%s\n' \
          'worker_processes  1;' \
          'pid        logs/nginx.pid;' \
          'events {' \
          '    use iocp;' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       18081;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "IOCP OK";' \
          '        }' \
          '    }' \
          '}' > iocp-test.conf

        if ./objs/nginx.exe -t -c "$PWD/iocp-test.conf"; then
          echo "✓ IOCP event method validated"
        else
          echo "✗ IOCP validation failed"
          exit 1
        fi

    - name: Test select event method
      shell: msys2 {0}
      run: |
        echo "=== Test select event method ==="

        printf '%s\n' \
          'worker_processes  1;' \
          'pid        logs/nginx.pid;' \
          'events {' \
          '    use select;' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       18082;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "Select OK";' \
          '        }' \
          '    }' \
          '}' > select-test.conf

        if ./objs/nginx.exe -t -c "$PWD/select-test.conf"; then
          echo "✓ Select event method validated"
        else
          echo "✗ Select validation failed"
          exit 1
        fi

    - name: Test poll event method
      shell: msys2 {0}
      run: |
        echo "=== Test poll event method ==="

        printf '%s\n' \
          'worker_processes  1;' \
          'pid        logs/nginx.pid;' \
          'events {' \
          '    use poll;' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       18083;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "Poll OK";' \
          '        }' \
          '    }' \
          '}' > poll-test.conf

        if ./objs/nginx.exe -t -c "$PWD/poll-test.conf"; then
          echo "✓ Poll event method validated"
        else
          echo "✗ Poll validation failed"
          exit 1
        fi

    - name: Test multi-worker configuration
      shell: msys2 {0}
      run: |
        echo "=== Test multi-worker configuration ==="

        printf '%s\n' \
          'worker_processes  4;' \
          'pid        logs/nginx.pid;' \
          'events {' \
          '    use iocp;' \
          '    worker_connections  1024;' \
          '}' \
          'http {' \
          '    default_type  application/octet-stream;' \
          '    server {' \
          '        listen       18084;' \
          '        server_name  localhost;' \
          '        location / {' \
          '            return 200 "Multi-worker OK";' \
          '        }' \
          '    }' \
          '}' > multi-worker-test.conf

        if ./objs/nginx.exe -t -c "$PWD/multi-worker-test.conf"; then
          echo "✓ Multi-worker configuration validated"
        else
          echo "✗ Multi-worker validation failed"
          exit 1
        fi
