name: Code Quality

on:
  push:
    branches: [ master, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Check Code Quality
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-pkg-config

    - name: Run configure to generate files
      shell: msys2 {0}
      run: |
        ./misc/check-configure.sh configure.log \
          ./auto/configure --with-cc=gcc --with-debug

    - name: Test configure exit status handling
      shell: msys2 {0}
      run: ./misc/test-check-configure.sh

    - name: Check shell scripts
      shell: msys2 {0}
      run: |
        for script in misc/*.sh; do
          bash -n "$script"
        done

        set +e
        BENCH_SCRATCH_ROOT=relative RESULTS_DIR=/tmp/results \
          misc/win32-oha-bench.sh /tmp/nginx.exe iocp >/tmp/oha.out 2>/tmp/oha.err
        status=$?
        set -e
        test "$status" -eq 2
        grep -Fq 'BENCH_SCRATCH_ROOT must be an absolute path' /tmp/oha.err

        set +e
        BENCH_SCRATCH_ROOT=/tmp RESULTS_DIR=relative \
          misc/win32-oha-bench.sh /tmp/nginx.exe iocp >/tmp/oha.out 2>/tmp/oha.err
        status=$?
        set -e
        test "$status" -eq 2
        grep -Fq 'RESULTS_DIR must be an absolute path' /tmp/oha.err

        set +e
        BENCH_SCRATCH_ROOT=/tmp RESULTS_DIR=/tmp NGX_GPROF_DIR=relative \
          misc/win32-oha-bench.sh /tmp/nginx.exe iocp >/tmp/oha.out 2>/tmp/oha.err
        status=$?
        set -e
        test "$status" -eq 2
        grep -Fq 'NGX_GPROF_DIR must be an absolute path' /tmp/oha.err

    - name: Test oha result validation
      shell: pwsh
      run: |
        node .\misc\test-validate-oha-summary.js
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Check for configuration warnings
      shell: msys2 {0}
      run: |
        if grep -E "error:|^.*\berror\b" configure.log | grep -v "error log file"; then
          echo "❌ Configuration errors found"
          exit 1
        elif grep -i "warning" configure.log; then
          echo "⚠️ Configuration warnings found (non-fatal)"
        else
          echo "✓ No configuration warnings"
        fi

    - name: Verify Windows-specific files
      shell: pwsh
      run: |
        Write-Host "Checking Windows port files..."
        $files = @(
          "src/os/win32/ngx_process.c",
          "src/os/win32/ngx_process.h",
          "src/event/modules/ngx_iocp_module.c",
          "src/event/modules/ngx_iocp_module.h",
          "docs/win32.md"
        )
        
        foreach ($file in $files) {
          if (Test-Path $file) {
            Write-Host "✓ $file exists"
          } else {
            Write-Host "✗ $file missing"
            exit 1
          }
        }

    - name: Check documentation
      shell: pwsh
      run: |
        Write-Host "Checking documentation files..."
        if (Test-Path "docs/win32.md") {
          $content = Get-Content "docs/win32.md" -Raw
          if ($content -match "iocp") {
            Write-Host "✓ IOCP documentation present"
          }
        }
