name: Release Build

# Releases are produced exclusively by CI.  The build runs on a GitHub-hosted
# runner and the resulting artifact is signed with a Sigstore build provenance
# attestation, so consumers can verify the binary came from this workflow at a
# specific commit and was not built or altered locally.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build (dry run; no release is published)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release:
    name: Build and Attest Release
    runs-on: windows-2022
    timeout-minutes: 60

    permissions:
      contents: write        # create the GitHub release
      id-token: write        # Sigstore OIDC token for attestation
      attestations: write    # record the provenance attestation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          base-devel
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-pcre2
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openssl
          mingw-w64-x86_64-pkg-config
          zip

    - name: Build optimized release
      shell: msys2 {0}
      run: |
        # Paths are relative with an empty prefix, matching upstream's win32
        # recipe in misc/GNUmakefile. This keeps the package relocatable: every
        # path resolves inside whatever directory the user unzips it into and
        # passes via -p. Absolute paths such as /nginx/logs would resolve
        # against the prefix and break the unzip-and-run flow.
        ./auto/configure \
          --with-cc=gcc \
          --with-cc-opt="-O2 -march=x86-64 -mtune=generic -DFD_SETSIZE=1024" \
          --with-ld-opt="-Wl,-s" \
          --prefix= \
          --sbin-path=nginx.exe \
          --conf-path=conf/nginx.conf \
          --pid-path=logs/nginx.pid \
          --error-log-path=logs/error.log \
          --http-log-path=logs/access.log \
          --with-pcre \
          --with-http_ssl_module \
          --with-http_v2_module \
          --with-http_realip_module \
          --with-http_addition_module \
          --with-http_sub_module \
          --with-http_dav_module \
          --with-http_flv_module \
          --with-http_mp4_module \
          --with-http_gunzip_module \
          --with-http_gzip_static_module \
          --with-http_auth_request_module \
          --with-http_random_index_module \
          --with-http_secure_link_module \
          --with-http_degradation_module \
          --with-http_slice_module \
          --with-http_stub_status_module \
          --with-stream \
          --with-stream_ssl_module \
          --with-stream_realip_module \
          --with-stream_ssl_preread_module

        make -j$(nproc)

        ./objs/nginx.exe -V

    - name: Verify release build is not a debug build
      shell: msys2 {0}
      run: |
        # A --with-debug binary must never be shipped as a release.
        if ./objs/nginx.exe -V 2>&1 | grep -q -- '--with-debug'; then
          echo "release binary was configured with --with-debug"
          exit 1
        fi
        echo "OK: release binary has no debug instrumentation"

    - name: Verify tag matches source version
      if: startsWith(github.ref, 'refs/tags/')
      shell: msys2 {0}
      run: |
        # Guards against tagging a commit whose nginx.h says something else.
        src_version=$(sed -n 's/^#define NGINX_VERSION *"\(.*\)"/\1/p' src/core/nginx.h)
        tag="${GITHUB_REF#refs/tags/}"
        tag_version="${tag#v}"
        tag_version="${tag_version%%-*}"

        echo "source version: $src_version"
        echo "tag version:    $tag_version"

        if [ "$src_version" != "$tag_version" ]; then
          echo "tag $tag does not match NGINX_VERSION $src_version"
          exit 1
        fi
        echo "OK: tag matches source version"

    - name: Run release candidate tests
      shell: pwsh
      run: |
        $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

        $openssl = Get-Command openssl -ErrorAction SilentlyContinue
        if ($openssl) {
          Write-Host "Running RC matrix with TLS via $($openssl.Source)"
          .\misc\win32-rc-test.ps1 -Binary .\objs\nginx.exe -OpenSSLBinary $openssl.Source
        } else {
          Write-Host "openssl not found; running RC matrix without TLS"
          .\misc\win32-rc-test.ps1 -Binary .\objs\nginx.exe
        }
        if ($LASTEXITCODE -ne 0) {
          Write-Host "RC tests failed with code $LASTEXITCODE"
          exit 1
        }

    - name: Prepare release package
      shell: msys2 {0}
      run: |
        set -eu

        version=$(sed -n 's/^#define NGINX_VERSION *"\(.*\)"/\1/p' src/core/nginx.h)
        if [ -z "$version" ]; then
          echo "could not determine NGINX_VERSION"
          exit 1
        fi
        pkg="nginx-iocp-${version}-win64"

        mkdir -p "$pkg/conf" "$pkg/logs" "$pkg/html" "$pkg/docs"

        cp objs/nginx.exe "$pkg/"
        cp -r conf/. "$pkg/conf/"

        # The default docroot ships in docs/html, not html; nginx.conf's
        # "root html" resolves relative to the install prefix.
        cp -r docs/html/. "$pkg/html/"

        cp LICENSE "$pkg/"
        cp README.md "$pkg/"
        cp docs/win32.md docs/win32-iocp-performance.md "$pkg/docs/"

        # Bundle the MinGW runtime DLLs the binary actually links against.
        # The `if` keeps a non-matching last iteration from tripping `set -e`.
        ldd objs/nginx.exe | awk '/mingw64/ {print $3}' | sort -u | while read -r dll; do
          if [ -f "$dll" ]; then
            cp "$dll" "$pkg/"
            echo "bundled $(basename "$dll")"
          fi
        done

        # Fail loudly rather than shipping a package that cannot start.
        for required in nginx.exe conf/nginx.conf conf/mime.types html/index.html LICENSE; do
          if [ ! -f "$pkg/$required" ]; then
            echo "package is missing $required"
            exit 1
          fi
        done

        # nginx does not create a missing logs/ directory; without it the
        # default configuration fails to open its log files on startup.
        if [ ! -d "$pkg/logs" ]; then
          echo "package is missing the logs directory"
          exit 1
        fi

        zip -qr "$pkg.zip" "$pkg"
        sha256sum "$pkg.zip" | tee "$pkg.zip.sha256"

        echo "PACKAGE_NAME=$pkg" >> "$GITHUB_ENV"
        echo "VERSION=$version" >> "$GITHUB_ENV"

    - name: Smoke test the packaged binary
      shell: pwsh
      run: |
        # Run the packaged tree exactly as a user would unzip and run it,
        # so a broken package fails the release instead of shipping.
        $pkg = "${{ env.PACKAGE_NAME }}"
        Push-Location $pkg
        try {
          New-Item -ItemType Directory -Path logs -Force | Out-Null

          $conf = @(
            'worker_processes 1;',
            'error_log logs/error.log notice;',
            'pid logs/nginx.pid;',
            'events { worker_connections 256; }',
            'http {',
            '    include mime.types;',
            '    default_type application/octet-stream;',
            '    server {',
            '        listen 18100;',
            '        location / { root html; index index.html; }',
            '    }',
            '}'
          ) -join "`n"
          $conf | Out-File -Encoding ASCII conf/release-smoke.conf

          .\nginx.exe -t -p ./ -c conf/release-smoke.conf
          if ($LASTEXITCODE -ne 0) { throw "packaged binary failed config test" }

          Start-Process -FilePath ".\nginx.exe" `
            -ArgumentList "-p","./","-c","conf/release-smoke.conf" -NoNewWindow

          $ready = $false
          foreach ($attempt in 1..30) {
            Start-Sleep -Milliseconds 500
            try {
              $resp = Invoke-WebRequest -Uri http://127.0.0.1:18100/ `
                -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
          }
          if (-not $ready) {
            if (Test-Path logs/error.log) { Get-Content logs/error.log }
            throw "packaged nginx did not serve the default page"
          }
          Write-Host "OK: packaged nginx served the default page"

          .\nginx.exe -p ./ -s quit -c conf/release-smoke.conf
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Process nginx -ErrorAction SilentlyContinue) -and
                 ((Get-Date) -lt $deadline)) {
            Start-Sleep -Milliseconds 500
          }
        } finally {
          Get-Process nginx -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Force conf/release-smoke.conf -ErrorAction SilentlyContinue
          # Clear the log contents but keep the directory: nginx does not
          # create a missing logs/ dir, so shipping without it breaks startup.
          Remove-Item -Force logs/* -ErrorAction SilentlyContinue
          Pop-Location
        }

        # Repackage so the zip never contains smoke-test leftovers.
        Remove-Item -Force "$pkg.zip"
        Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
        (Get-FileHash "$pkg.zip" -Algorithm SHA256).Hash.ToLower() + "  $pkg.zip" |
          Out-File -Encoding ASCII "$pkg.zip.sha256"
        Get-Content "$pkg.zip.sha256"

    - name: Generate build provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ env.PACKAGE_NAME }}.zip

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: |
          ${{ env.PACKAGE_NAME }}.zip
          ${{ env.PACKAGE_NAME }}.zip.sha256
        retention-days: 90

    - name: Publish GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
      with:
        files: |
          ${{ env.PACKAGE_NAME }}.zip
          ${{ env.PACKAGE_NAME }}.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          nginx-iocp ${{ env.VERSION }} for Windows x64.

          Built exclusively by GitHub Actions from `${{ github.sha }}`.
          The archive carries a Sigstore build provenance attestation; verify it with:

          ```
          gh attestation verify ${{ env.PACKAGE_NAME }}.zip --repo ${{ github.repository }}
          ```

          SHA256 checksums are in `${{ env.PACKAGE_NAME }}.zip.sha256`.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
